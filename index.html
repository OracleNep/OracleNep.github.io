<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Page Removed</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #1f2937;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(560px, calc(100% - 40px));
      padding: 32px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #fff;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main>
    <h1>Page Removed</h1>
    <p>This page has been removed and intentionally contains no personal information.</p>
  </main>
</body>
</html>
