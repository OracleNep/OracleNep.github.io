name: Update EDUSRC Rank

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch EDUSRC rank
        run: node scripts/update-edusrc-rank.mjs

      - name: Commit rank update
        run: |
          if git diff --quiet -- data/edusrc-rank.json; then
            echo "No EDUSRC rank change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edusrc-rank.json
          git commit -m "Update EDUSRC rank"
          git push
